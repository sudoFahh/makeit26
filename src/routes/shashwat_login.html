<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Metro Nexus</title>

		<script>
			
		</script>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family: Arial, sans-serif;
			}

			body {
				min-height: 100vh;

				display: flex;

				justify-content: center;

				align-items: center;

				padding: 20px;

				background: linear-gradient(135deg, #000814, #081225, #1b2233);

				color: white;
			}

			.meow1 {
				width: 450px;

				min-height: 844px;

				padding: 32px;

				border-radius: 35px;

				background: linear-gradient(180deg, #020617, #0f172a);
			}

			.meow2 {
				display: flex;

				justify-content: space-between;

				align-items: flex-start;
			}

			.meow3 h1 {
				font-size: 58px;

				font-weight: 700;

				line-height: 0.9;
			}

			.meow4 {
				margin-top: 20px;
			}

			.meow4 p:first-child {
				font-size: 18px;

				font-weight: 600;
			}

			.meow4 p:last-child {
				font-size: 18px;

				color: #6366f1;

				font-weight: 600;
			}

			.meow5 {
				width: 115px;

				height: 115px;

				border-radius: 20px;

				overflow: hidden;
			}

			.meow5 img {
				width: 100%;

				height: 100%;

				object-fit: cover;
			}

			.meow6 {
				margin-top: 80px;
			}

			.meow6 h2 {
				font-size: 48px;

				font-weight: 700;
			}

			.meow6 p {
				font-size: 22px;

				color: #d1d5db;
			}

			.meow7 {
				margin-top: 50px;
			}

			.meow8,
			.meow9 {
				width: 100%;

				height: 78px;

				background: #252c49;

				border-radius: 20px;

				display: flex;

				align-items: center;

				padding: 0 20px;

				margin-bottom: 20px;
			}

			.meow10 {
				width: 55px;

				height: 55px;

				border-radius: 15px;

				background: #6366f1;

				margin-right: 20px;
			}

			.meow11 {
				flex: 1;
			}

			.meow11 input {
				width: 100%;

				border: none;

				outline: none;

				background: transparent;

				color: white;

				font-size: 18px;
			}

			.meow11 input::placeholder {
				color: #cbd5e1;
			}

			.meow12 {
				font-size: 28px;

				cursor: pointer;
			}

			.meow13 {
				text-align: right;

				margin-top: 10px;
			}

			.meow13 a {
				color: #6366f1;

				text-decoration: none;
			}

			.meow14 {
				margin-top: 60px;
			}

			.meow14 button {
				width: 100%;

				height: 90px;

				border: none;

				border-radius: 25px;

				font-size: 38px;

				font-weight: 700;

				cursor: pointer;

				background: linear-gradient(to right, #6366f1, #b8b8ff);
			}

			.meow15 {
				display: flex;

				align-items: center;

				gap: 15px;

				margin-top: 55px;
			}

			.meow16 {
				flex: 1;

				height: 2px;

				background: white;
			}

			.meow17 {
				font-size: 24px;

				font-weight: 700;
			}

			.meow18 {
				margin-top: 50px;

				display: flex;

				justify-content: space-between;

				gap: 20px;
			}

			.meow19 {
				flex: 1;

				height: 110px;

				border-radius: 22px;

				background: #252c49;

				display: flex;

				justify-content: center;

				align-items: center;

				cursor: pointer;

				transition: 0.3s;
			}

			.meow19:hover {
				transform: translateY(-4px);
			}

			.meow19 img {
				width: 50px;
				border-radius: 35%;
				height: 50px;

				object-fit: contain;
			}

			.meow20 {
				margin-top: 90px;

				text-align: center;
			}

			.meow20 p:first-child {
				color: gray;

				font-size: 20px;
			}

			.meow20 p:last-child {
				color: #d0ffe9;

				font-size: 32px;

				font-weight: 700;

				margin-top: 10px;
			}
		</style>
	</head>

	<body>
		<div class="meow1">
			<div class="meow2">
				<div class="meow3">
					<h1>METRO<br />NEXUS</h1>

					<div class="meow4">
						<p>Your City.</p>

						<p>One Tap Ahead.</p>
					</div>
				</div>

				<div class="meow5">
					<img src="meow.png" alt="Logo" />
				</div>
			</div>

			<div class="meow6">
				<h2>Welcome Back!</h2>

				<p>Sign in to continue your journey.</p>
			</div>

			<div class="meow7">
				<div class="meow8">
					<div class="meow10"></div>

					<div class="meow11">
						<input type="text" placeholder="Email or Phone Number" />
					</div>
				</div>

				<div class="meow9">
					<div class="meow10"></div>

					<div class="meow11">
						<input type="password" placeholder="Password" />
					</div>

					<div class="meow12">
						<p></p>
					</div>
				</div>
			</div>

			<div class="meow13">
				<a href="#">Forgot Password?</a>
			</div>

			<div class="meow14">
				<button onclick="makeLogin">Log In →</button>
			</div>

			<div class="meow20">
				<p>Don't have an account?</p>

				<p>Create Account →</p>
			</div>
		</div>
	</body>
</html>
