    <title>meow em </title>
    <style>
body {
    display: flex;
    justify-content: center;
    padding: 40px;
    font-family: sans-serif;
}
#meow1 {
    background-color: #1c1c1e;
    width: 400px;
    border-radius: 20px;
    padding: 20px;
}
#meow2 {
    display: flex;
    justify-content: space-between;
    color: white;
    margin-bottom: 16px;
}
#meow2 a {
    color: #7c86ff;

}
#meow3 {
    display: flex;

#meow4 {

    padding: 16px;
    color: white;
}
#meow4 button {
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    margin-top: 14px;
}
#meow5 {
    flex: 1;
    background-color: #141414;
    border-radius: 16px;
    padding: 16px;
    color: white;
}
#meow6 {
    background-color: #141414;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: space-around;
    color: white;
    text-align: center;
    font-size: 13px;
}
.circle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background-color: #4b3fc9;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 8px;
}
</style>
</head>
